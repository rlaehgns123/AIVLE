#서버 설정
server:
  port: 8080

#애플리케이션 설정
spring:
  application:
    name: bookapp
  datasource:
    drive-class-name: org.h2.Driver
    url: jdbc:h2:mem:bookdb
    username: sa
    password: 1234
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
